version: '3.8'

services:
  house-price-api:
    build: ../services/model_service
    ports:
      - "8000:8000"
    environment:
      - MODEL_BASE_DIR=/models
      - DEFAULT_MODEL_KEY=model_A
    volumes:
      # Mount both model artifacts for hot swapping
      - ../training/model_A/artifacts:/models/model_A:ro
      - ../training/model_B/artifacts:/models/model_B:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a load balancer for scaling
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - house-price-api
    restart: unless-stopped
    profiles:
      - production
