# Model A Training Configuration

data:
  sales_path: "../../data/kc_house_data.csv"
  demographics_path: "../../data/zipcode_demographics.csv"

features:
  sales_columns:
    - 'price'
    - 'bedrooms'
    - 'bathrooms'
    - 'sqft_living'
    - 'sqft_lot'
    - 'floors'
    - 'sqft_above'
    - 'sqft_basement'
    - 'zipcode'

training:
  random_state: 42
  test_size: 0.2

output:
  artifacts_dir: "./artifacts"
